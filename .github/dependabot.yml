# Updates are always grouped (GitHub standard, giocaizzi/.github docs/standard.md).
# Every entry sets commit-message.prefix so PR titles pass the Validate PR title check:
# "ci(deps)" for github-actions, "chore(deps)" for every other ecosystem.
# Language ecosystems (uv, npm, ...) use three groups:
#   commit-message:
#     prefix: "chore(deps)"
#   groups:
#     minor-patch: {update-types: [minor, patch]}
#     major: {update-types: [major]}
#     security: {applies-to: security-updates, patterns: ["*"]}
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
