# Updates are batched: weekly, capped and always grouped (GitHub standard, giocaizzi/.github docs/standard.md,
# Dependabot updates). Every entry sets commit-message.prefix so PR titles pass the Validate PR title check:
# "ci(deps)" for github-actions, "chore(deps)" for every other ecosystem.
# Security updates are a repo setting: raised as advisories appear, never held to the schedule, the cap or the groups.
# Language ecosystems (uv, npm, ...) use this shape:
#   schedule:
#     interval: weekly
#   open-pull-requests-limit: 2
#   commit-message:
#     prefix: "chore(deps)"
#   groups:
#     minor-patch: {update-types: [minor, patch]}
#     major: {update-types: [major]}
#     security: {applies-to: security-updates, patterns: ["*"]}
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
